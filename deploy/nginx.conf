# Copy to /etc/nginx/sites-available/tapzm.com and enable it.
# The loop on /assets happens when a separate js/css location
# rewrites to https (or Cloudflare Flexible + origin also 301s).
# Proxy EVERY path, including /assets, to the app.

upstream meridian {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tapzm.com www.tapzm.com;
    return 301 https://tapzm.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tapzm.com www.tapzm.com;

    ssl_certificate     /etc/letsencrypt/live/tapzm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapzm.com/privkey.pem;

    # Do not add location ~* \.(js|css|png|svg)$ { return 301 https://... }
    # That is what produces ERR_TOO_MANY_REDIRECTS on /assets.

    location / {
        proxy_pass http://meridian;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}
